server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Base : H2 en mémoire par défaut, PostgreSQL via variables d'environnement
spring.datasource.url=${DB_URL:jdbc:h2:mem:pneumonia}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Service ML (mode simulation activé par défaut)
ml.service.url=${ML_URL:http://localhost:7860}
ml.mock=${ML_MOCK:true}
