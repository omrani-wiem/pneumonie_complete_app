spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Base : H2 en mémoire par défaut, PostgreSQL via variables d'environnement
spring.datasource.url=${DB_URL:jdbc:h2:mem:pneumonia}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Console H2 : désactivée par défaut
spring.h2.console.enabled=${H2_CONSOLE:false}

# Service ML : mode simulation DÉSACTIVÉ par défaut
ml.service.url=${ML_URL:http://localhost:7860}


# Secret JWT : AUCUNE valeur par défaut
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Limitation des tentatives de connexion
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Derrière un proxy de confiance (Render, etc.) mettre FORWARD_HEADERS=framework pour voir la vraie IP.
# Sinon laisser "none" (l'en-tête X-Forwarded-For peut être falsifié).
server.forward-headers-strategy=${FORWARD_HEADERS:none}

ml.service.secret=${ML_SHARED_SECRET:}



spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Version du modele ML, enregistree avec chaque analyse (laisser vide si inconnue)
app.ml.model-version=${ML_MODEL_VERSION:}